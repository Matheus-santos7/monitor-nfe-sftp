# Frontend do monitor: serve o painel (index.html) e repassa à API só as rotas que o painel usa.
# Mesmo endereço para página e API = sem CORS. O Caddy (proxy) põe o HTTPS na frente.

# Log sem query string: o link do painel leva ?token=… e não pode ir parar no log.
log_format painel '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
  listen 80;
  server_tokens off;
  access_log /dev/stdout painel;
  root /usr/share/nginx/html;

  # Painel interno com dados fiscais: nunca indexar, não vazar a URL (token) em links.
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header Cache-Control "no-store" always;

  location = / {
    try_files /index.html =404;
  }

  # API usada pelo painel. O token vai no header Authorization (repassado como veio).
  location ~ ^/(status|historico|ciclo/agora|health)$ {
    proxy_pass http://api:8080;
    proxy_read_timeout 60s;
  }

  location / {
    return 404;
  }
}

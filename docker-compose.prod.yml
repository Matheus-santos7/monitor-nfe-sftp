# Overlay do servidor, aplicado por cima do docker-compose.yml:
#   - MODO_AGENDA=ativo: o monitor agenda, espera e envia os avisos de verdade
#   - CONTINGENCIA=on:   renotifica o gateway fiscal quando o ML não avisou
# Fora da VPS os dois ficam desligados (sombra / off).
# Atalho: COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml no .env da VPS.
#
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans

services:
  monitor-sftp:
    environment:
      # Para pausar em produção: MODO_AGENDA=off ou CONTINGENCIA=off no .env.
      MODO_AGENDA: ${MODO_AGENDA:-ativo}
      CONTINGENCIA: ${CONTINGENCIA:-on}

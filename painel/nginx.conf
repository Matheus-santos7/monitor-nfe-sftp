# Frontend do monitor: serve o painel (index.html) e repassa à API só as rotas que o painel usa.
# Mesmo endereço para página e API = sem CORS. O Caddy (proxy) põe o HTTPS na frente.

# Log sem query string (nada sensível deveria ir na URL, mas por garantia o log não grava).
log_format painel '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
  listen 80;
  server_tokens off;
  access_log /dev/stdout painel;
  root /usr/share/nginx/html;
  client_max_body_size 16k; # só o login manda corpo

  # IP real do cliente: o Caddy (proxy) põe em X-Forwarded-For. Só aceita esse header vindo da rede interna do compose.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;

  # Painel interno com dados fiscais: nunca indexar, não vazar a URL (token) em links.
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header Cache-Control "no-store" always;

  location = / {
    try_files /index.html =404;
  }

  # API usada pelo painel (sessão no cookie, repassado como veio). X-Real-IP sobrescrito: o cliente não forja.
  location ~ ^/(status|historico|ciclo/agora|health|login|logout|sessao)$ {
    proxy_pass http://api:8080;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
  }

  location / {
    return 404;
  }
}

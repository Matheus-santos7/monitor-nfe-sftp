# Monitor NF-e Mercado Livre × SFTP — o projeto inteiro num compose só.
#
#   Servidor (imagens prontas do GHCR, publicadas pelo CI a cada merge na main):
#     docker compose pull && docker compose up -d      baixa a versão MONITOR_VERSAO e sobe
#   Desenvolvimento (compila do código desta pasta):
#     docker compose up -d --build
#   docker compose logs -f            acompanha tudo (ou: logs -f api | painel | proxy)
#
# Serviços e portas:
#   api     backend (API, agenda do ciclo, avisos)    127.0.0.1:${API_PORTA:-8081}
#   painel  frontend (painel e histórico)             127.0.0.1:${PAINEL_PORTA:-8080}
#   proxy   HTTPS (Caddy) — um DNS por serviço        :80 e :443
#           https://$PAINEL_HOST → painel   ·   https://$API_HOST → api
#
# Local, os padrões são seguros (agenda em SOMBRA, contingência off, *.localhost).
# No servidor, o .env define MODO_AGENDA=ativo, CONTINGENCIA=on, PAINEL_HOST e API_HOST. Ver docs/deploy.md.

name: monitor-nfe

x-logs: &logs
  driver: json-file
  options:
    max-size: "10m" # rotação: o docker compose logs não enche o disco do servidor
    max-file: "5"

services:
  # Backend: API + agenda do ciclo + avisos. Sem /painel (o painel é o serviço abaixo).
  api:
    image: ${MONITOR_REGISTRO:-ghcr.io/matheus-santos7}/monitor-nfe-api:${MONITOR_VERSAO:-latest}
    build: ./monitoramento
    container_name: monitor-api
    restart: unless-stopped
    environment:
      CONFIG_PATH: /app/config.yml
      PORT: "8080"
      TZ: ${TZ}
      MONITOR_HTTP_TOKEN: ${MONITOR_HTTP_TOKEN:-} # Bearer para scripts/integrações (API_HOST); nunca na URL
      # Login do painel: contas por pessoa (npm run senha) e segredo que assina o cookie de sessão
      PAINEL_USUARIOS: ${PAINEL_USUARIOS:-}
      SESSAO_SEGREDO: ${SESSAO_SEGREDO:-}
      PAINEL_HOST: ${PAINEL_HOST:-painel.localhost} # Origin permitida (CSRF)
      PAINEL_PORTA: ${PAINEL_PORTA:-8080}
      FAKE_NOTA: ${FAKE_NOTA:-}
      PAINEL_INTERVALO_MIN: ${PAINEL_INTERVALO_MIN:-5}
      # Padrões seguros. No servidor, o .env define MODO_AGENDA=ativo e CONTINGENCIA=on.
      CONTINGENCIA: ${CONTINGENCIA:-off}
      MODO_AGENDA: ${MODO_AGENDA:-sombra} # off | sombra (sem contingência, sem avisos) | ativo
      AGENDA_CICLO: ${AGENDA_CICLO:-0 8-18 * * 1-5}
      RESUMO_CRON: ${RESUMO_CRON:-0 10,18 * * 1-5}
      TOLERANCIA_MIN: ${TOLERANCIA_MIN:-20} # nota ausente há menos que isso = em trânsito (sem alerta)
      GOOGLE_CHAT_WEBHOOK_URL: ${GOOGLE_CHAT_WEBHOOK_URL:-}
      WHATSAPP_WEBHOOK_URL: ${WHATSAPP_WEBHOOK_URL:-}
      WHATSAPP_TO: ${WHATSAPP_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ML_ACCESS_TOKEN: ${ML_ACCESS_TOKEN:-}
      ML_REFRESH_TOKEN: ${ML_REFRESH_TOKEN:-}
      ML_CLIENT_ID: ${ML_CLIENT_ID:-}
      ML_CLIENT_SECRET: ${ML_CLIENT_SECRET:-}
      ML_USER_ID: ${ML_USER_ID:-}
      ML_APPLICATION_ID: ${ML_CLIENT_ID:-}
      ML_TETO_DIAS: ${ML_TETO_DIAS:-1}
      ML_TETO_CACHE_MIN: ${ML_TETO_CACHE_MIN:-5}
      ML_TOKENS_PATH: /app/data/ml-tokens.json
      ML_ENV_PATH: /app/.env.host
      NERUS_TENANT_ID: ${NERUS_TENANT_ID:-}
      NERUS_SSH_HOST: ${NERUS_SSH_HOST:-}
      NERUS_SSH_PORT: ${NERUS_SSH_PORT:-22}
      NERUS_SSH_USER: ${NERUS_SSH_USER:-}
      NERUS_SSH_KEY: /run/secrets/bastion.pem
      NERUS_DB_HOST: ${NERUS_DB_HOST:-}
      NERUS_DB_PORT: ${NERUS_DB_PORT:-3306}
      NERUS_DB_USER: ${NERUS_DB_USER:-}
      NERUS_DB_PASSWORD: ${NERUS_DB_PASSWORD:-}
      NERUS_AUTH_URL: ${NERUS_AUTH_URL:-}
      NERUS_USERNAME: ${NERUS_USERNAME:-}
      NERUS_PASSWORD: ${NERUS_PASSWORD:-}
      NERUS_NOTIFICATION_URL: ${NERUS_NOTIFICATION_URL:-}
    volumes:
      - ./monitoramento/config.yml:/app/config.yml:ro
      - ./monitoramento/data:/app/data
      - ./.env:/app/.env.host
      - ${NERUS_SSH_KEY_HOST_PATH:-./secrets/bastion.pem}:/run/secrets/bastion.pem:ro
    ports:
      - "127.0.0.1:${API_PORTA:-8081}:8080" # direto no servidor (curl/túnel); de fora, só via proxy HTTPS
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - monitor
    logging: *logs

  # Frontend: painel estático (painel/index.html) + repasse das rotas do painel para a api.
  painel:
    image: ${MONITOR_REGISTRO:-ghcr.io/matheus-santos7}/monitor-nfe-painel:${MONITOR_VERSAO:-latest}
    build: ./painel # index.html + nginx.conf vão dentro da imagem
    container_name: monitor-painel
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${PAINEL_PORTA:-8080}:80"
    networks:
      - monitor
    logging: *logs

  # HTTPS na frente dos dois: certificado automático (Let's Encrypt) para os nomes do .env.
  proxy:
    image: ${MONITOR_REGISTRO:-ghcr.io/matheus-santos7}/monitor-nfe-proxy:${MONITOR_VERSAO:-latest}
    build: ./proxy # Caddyfile vai dentro da imagem
    container_name: monitor-proxy
    restart: unless-stopped
    depends_on:
      - api
      - painel
    environment:
      PAINEL_HOST: ${PAINEL_HOST:-painel.localhost}
      API_HOST: ${API_HOST:-api.localhost}
    volumes:
      - caddy_data:/data # certificados: não apague
      - caddy_config:/config
    ports:
      - "${HTTP_PORTA:-80}:80"
      - "${HTTPS_PORTA:-443}:443"
    networks:
      - monitor
    logging: *logs

volumes:
  caddy_data:
  caddy_config:

networks:
  monitor:
    driver: bridge
